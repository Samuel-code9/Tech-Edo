<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign up — touredo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <header class="navbar" id="navbar"></header>
  <div class="page">
    <div class="container">
      <div class="form-card">
        <h1 style="font-size:24px;">Create your account</h1>
        <div id="error-box"></div>
        <div id="success-box"></div>
        <form id="signup-form">
          <div class="field">
            <label for="username">Username</label>
            <input id="username" name="username" type="text" required />
          </div>
          <div class="field">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" required />
          </div>
          <div class="field">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" required minlength="6" />
          </div>
          <button type="submit" class="btn btn-primary btn-block" id="submit-btn">Sign up</button>
        </form>
        <div class="form-footer">Already have an account? <a href="./login.html">Log in</a></div>
      </div>
    </div>
  </div>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/signup.js"></script>
</body>
</html>
