<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Attractions — touredo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <header class="navbar" id="navbar"></header>
  <div class="container">
    <div class="category-pills" id="category-pills">
      <button class="pill active" data-category="">All</button>
      <button class="pill" data-category="nature">Nature</button>
      <button class="pill" data-category="culture">Culture</button>
      <button class="pill" data-category="history">History</button>
      <button class="pill" data-category="adventure">Adventure</button>
      <button class="pill" data-category="entertainment">Entertainment</button>
    </div>
  </div>
  <div class="page">
    <div class="container">
      <h1 style="font-size:22px;">Attractions</h1>
      <div class="filters">
        <div class="field">
          <label for="f-min">Min price</label>
          <input id="f-min" type="number" min="0" />
        </div>
        <div class="field">
          <label for="f-max">Max price</label>
          <input id="f-max" type="number" min="0" />
        </div>
        <button class="btn btn-secondary btn-sm" id="filter-btn">Apply</button>
      </div>
      <div id="results"><div class="loading">Loading...</div></div>
    </div>
  </div>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/attractions.js"></script>
</body>
</html>
