<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot password — touredo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <header class="navbar" id="navbar"></header>
  <div class="page">
    <div class="container">
      <div class="form-card">
        <h1 style="font-size:24px;">Reset your password</h1>
        <div id="error-box"></div>
        <div id="result-box">
          <form id="forgot-form">
            <div class="field">
              <label for="email">Email</label>
              <input id="email" name="email" type="email" required />
            </div>
            <button type="submit" class="btn btn-primary btn-block" id="submit-btn">Send reset link</button>
          </form>
        </div>
        <div class="form-footer"><a href="./login.html">Back to login</a></div>
      </div>
    </div>
  </div>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/forgot-password.js"></script>
</body>
</html>
