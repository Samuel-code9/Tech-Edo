<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Plan my trip — touredo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <header class="navbar" id="navbar"></header>
  <div class="page">
    <div class="container">
      <h1 style="font-size:24px;">Plan my trip</h1>
      <p style="color:var(--ink-soft); max-width:520px;">Tell us your budget, how many days, and what you're into — we'll suggest a hotel and attractions that fit.</p>
      <div class="form-card">
        <div id="error-box"></div>
        <form id="recommend-form">
          <div class="field"><label for="budget">Budget (NGN)</label><input id="budget" type="number" min="0" required /></div>
          <div class="field"><label for="days">Days</label><input id="days" type="number" min="1" required /></div>
          <div class="field">
            <label for="interest">Interest</label>
            <select id="interest">
              <option value="nature">Nature</option>
              <option value="culture">Culture</option>
              <option value="history">History</option>
              <option value="adventure">Adventure</option>
              <option value="entertainment">Entertainment</option>
            </select>
          </div>
          <button type="submit" class="btn btn-primary btn-block">Get recommendations</button>
        </form>
      </div>
      <div id="result"></div>
    </div>
  </div>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/recommend.js"></script>
</body>
</html>
