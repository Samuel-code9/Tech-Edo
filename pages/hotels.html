<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hotels — touredo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <header class="navbar" id="navbar"></header>
  <div class="page">
    <div class="container">
      <h1 style="font-size:22px;">Hotels</h1>
      <div class="filters">
        <div class="field"><label for="f-min">Min price</label><input id="f-min" type="number" min="0" /></div>
        <div class="field"><label for="f-max">Max price</label><input id="f-max" type="number" min="0" /></div>
        <div class="field">
          <label for="f-availability">Availability</label>
          <select id="f-availability">
            <option value="">Any</option>
            <option value="true">Available</option>
            <option value="false">Not available</option>
          </select>
        </div>
        <button class="btn btn-secondary btn-sm" id="filter-btn">Apply</button>
      </div>
      <div id="results"><div class="loading">Loading...</div></div>
    </div>
  </div>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/hotels.js"></script>
</body>
</html>
