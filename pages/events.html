<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Events — touredo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <header class="navbar" id="navbar"></header>
  <div class="page">
    <div class="container">
      <h1 style="font-size:22px;">Events</h1>
      <div class="filters">
        <div class="field"><label for="f-state">State</label><input id="f-state" type="text" placeholder="e.g. Edo" /></div>
        <div class="field">
          <label for="f-category">Category</label>
          <select id="f-category">
            <option value="">All</option>
            <option value="festival">Festival</option>
            <option value="cultural">Cultural</option>
            <option value="concert">Concert</option>
            <option value="sports">Sports</option>
            <option value="other">Other</option>
          </select>
        </div>
        <div class="field">
          <label for="f-upcoming">Only upcoming</label>
          <select id="f-upcoming">
            <option value="">No</option>
            <option value="true">Yes</option>
          </select>
        </div>
        <button class="btn btn-secondary btn-sm" id="filter-btn">Apply</button>
      </div>
      <div id="results"><div class="loading">Loading...</div></div>
    </div>
  </div>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/events.js"></script>
</body>
</html>
